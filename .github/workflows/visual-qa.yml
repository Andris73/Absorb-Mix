name: Visual QA Absorb Mix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-3.44.6-git
      - name: Install pinned Flutter
        run: |
          if [ ! -d "$HOME/flutter/.git" ]; then
            git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
      - name: Build real simulator app
        run: |
          flutter pub get
          flutter build ios --debug --simulator --no-codesign
      - name: Install isolated UI test harness
        run: |
          gem install --user-install xcodeproj --no-document
          echo "QA_DIR=$RUNNER_TEMP/AbsorbMixQA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/AbsorbMixQA"
          cp tools/qa/AbsorbMixUITests.swift "$RUNNER_TEMP/AbsorbMixQA/"
          QA_DIR="$RUNNER_TEMP/AbsorbMixQA" ruby tools/qa/create_project.rb
          python3 - <<'PY'
          import json, subprocess, os
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          choices=[d for runtime, devices in data['devices'].items() if 'iOS' in runtime for d in devices if d['name'].startswith('iPhone') and d['isAvailable']]
          assert choices, 'No available iPhone simulator; do not substitute rendered mockups'
          device=choices[-1]
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('SIM_UDID='+device['udid']+'\n')
          print(device['name'],device['udid'])
          PY
      - name: Launch and exercise real controls
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" build/ios/iphonesimulator/Runner.app
          xcodebuild test -project "$QA_DIR/AbsorbMixQA.xcodeproj" -scheme AbsorbMixUITests -configuration Debug -destination "id=$SIM_UDID" -resultBundlePath "$QA_DIR/PhoneUITest.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d "$QA_DIR/PhoneUITest.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$QA_DIR/PhoneUITest.xcresult" --output-path "$QA_DIR/screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: absorb-mix-visual-qa
          path: |
            ${{ runner.temp }}/AbsorbMixQA/screenshots
            ${{ runner.temp }}/AbsorbMixQA/PhoneUITest.xcresult
          if-no-files-found: warn
